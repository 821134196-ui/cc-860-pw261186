[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pgpool-proxy"
version = "0.1.0"
description = "A restricted, session-aware PostgreSQL connection-pool proxy"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pgserver", "psycopg[binary]", "pytest"]

[project.scripts]
pgpool = "pgpool.server:main"

[tool.setuptools]
packages = ["pgpool"]

[tool.setuptools.package-data]
pgpool = ["static/*.html"]
